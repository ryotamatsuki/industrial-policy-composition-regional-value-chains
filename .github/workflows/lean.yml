name: lean-verification

on:
  push:
    branches: [main]
    paths:
      - 'IPCRVC/**'
      - 'IPCRVC.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'IPCRVC/**'
      - 'IPCRVC.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
      - 'docs/LEAN_FORMALIZATION.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Resolve pinned mathlib dependency
        run: lake update
      - name: Download mathlib build cache
        run: lake exe cache get
      - name: Kernel-check formalization
        run: lake build --wfail
