name: lean-verification

on:
  push:
    branches: [main]
    paths:
      - 'IPCRVC/**'
      - 'IPCRVC.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'IPCRVC/**'
      - 'IPCRVC.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/lean.yml'
      - 'docs/LEAN_FORMALIZATION.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Resolve pinned mathlib dependency
        run: lake update
      - name: Download mathlib build cache
        run: lake exe cache get
      - name: Kernel-check formalization
        run: lake build --wfail
