name: manuscript-build

on:
  pull_request:
    paths:
      - 'paper/**'
      - 'references/**'
      - 'figures/**'
      - 'tables/**'
      - 'scripts/generate_outputs.py'
      - 'submission/jrs/**'
      - 'Makefile'
      - '.github/workflows/manuscript.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - run: make all
